name: Daily Database Backup

on:
  schedule:
    # Täglich um 2:00 UTC (nachts)
    - cron: '0 2 * * *'
  # Manueller Trigger für Testing
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    name: Export Database Tables to private Artifact

    steps:
      - name: Export Database via Supabase REST API
        env:
          SUPABASE_URL: https://wpxcgducfkbozecknfdw.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p backups
          for TABLE in wallets referrals reports referral_payouts; do
            echo "Backing up $TABLE ..."
            curl -s -X GET "$SUPABASE_URL/rest/v1/$TABLE?limit=100000" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              > "backups/$TABLE-$(date +%Y-%m-%d).json"
          done
          echo "✅ Database backup created"
          ls -lh backups/

      # WICHTIG: Nutzerdaten (Wallets/Referrals/Payouts) NIEMALS ins (öffentliche) Repo committen.
      # Stattdessen als privates GitHub-Actions-Artifact ablegen – nur für Repo-Mitglieder,
      # mit Aufbewahrungsfrist. Zum echten Offsite-Backup ggf. auf einen privaten Bucket (S3/R2) pushen.
      - name: Upload backup as private artifact
        uses: actions/upload-artifact@v4
        with:
          name: klaryx-db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 14
          if-no-files-found: error
