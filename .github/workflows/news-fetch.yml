name: News Fetch

# Holt Solana-Sicherheits-News per RSS, fasst sie via Worker (KI) auf Deutsch zusammen
# und speichert sie in Supabase (Tabelle news). Manuell startbar + taeglich.
on:
  workflow_dispatch:
  schedule:
    # Mehrmals taeglich (nach dem Batch um 01:00), damit ein freies KI-Kontingent-Fenster
    # zuverlaessig erwischt wird. Neue News werden dedupliziert, also kein doppeltes Speichern.
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'

jobs:
  news_fetch:
    runs-on: ubuntu-latest
    name: Solana-Sicherheits-News holen und zusammenfassen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: News-Fetch ausführen
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "📰 Hole Solana-Sicherheits-News…"
          node .github/scripts/news_fetch.mjs

      - name: Fertig
        run: echo "✅ News-Fetch abgeschlossen – siehe klaryx.de/news.html"
